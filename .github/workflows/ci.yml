name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Engine and publisher integration tests
        shell: pwsh
        run: ./scripts/Test.ps1
      - name: Native Project-Z application
        run: dotnet build src/HeirowInstaller.App/HeirowInstaller.App.csproj -c Release --nologo
      - name: CLI
        run: dotnet build src/HeirowInstaller.Cli/HeirowInstaller.Cli.csproj -c Release --nologo
